# Build and deploy the FastAPI app to Azure App Service (Linux, Python 3.11).
#
# IMPORTANT: this workflow does NOT install dependencies. Azure's Oryx build
# does that on the platform during deployment, which requires the app setting
#   SCM_DO_BUILD_DURING_DEPLOYMENT = true
# (App Service -> Settings -> Environment variables -> App settings). Without it
# the container starts with no packages and dies with
#   ModuleNotFoundError: No module named 'uvicorn'
# See DEPLOYMENT.md.

name: Build and deploy Python app to Azure Web App - chatbot-starcare-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Zip source for deployment
        # One clean zip = fast, lossless transfer between jobs, and a proper
        # zipdeploy on the Azure side (which honours SCM_DO_BUILD_DURING_DEPLOYMENT
        # and runs Oryx / pip install).
        run: |
          zip -r release.zip . \
            -x '.git/*' \
            -x 'antenv/*' \
            -x '.venv/*' \
            -x 'venv/*' \
            -x 'chroma_data/*' \
            -x 'release.zip'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'chatbot-starcare-prod'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_EC86A389336446F1AD5C849CA559422A }}
          package: release.zip
          # NOTE: `startup-command` is NOT valid here with publish-profile auth.
          # Set it once in the portal instead (Configuration -> General settings
          # -> Startup Command):  python -m gunicorn main:app -c gunicorn.conf.py
